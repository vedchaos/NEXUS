<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"><\/script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --bg2: #111111; --bg3: #1a1a1a;
  --green: #00ff41; --green-dim: #00cc33; --green-glow: rgba(0,255,65,.15);
  --red: #ff0040; --yellow: #ffd700; --cyan: #00e5ff; --purple: #b388ff; --orange: #ff9100;
  --text: #c0c0c0; --text-dim: #666; --border: #222;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}
body { background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; min-height: 100vh; overflow-x: hidden; background-image: linear-gradient(rgba(0,255,65,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,.02) 1px, transparent 1px); background-size: 40px 40px; }
::selection { background: var(--green); color: var(--bg); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 3px; }
.scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0px, rgba(0,0,0,.03) 1px, transparent 1px, transparent 3px); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.6} }
@keyframes slide-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes bar-fill { from{width:0} }
header { border-bottom: 1px solid var(--green-dim); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; background: var(--bg2); position: relative; overflow: hidden; }
header::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
.header-left { display: flex; align-items: center; gap: 16px; }
.logo-text { color: var(--green); font-size: 18px; font-weight: bold; text-shadow: 0 0 10px var(--green-glow), 0 0 20px var(--green-glow); letter-spacing: 3px; }
.version { color: var(--text-dim); font-size: 11px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--green-dim); border-radius: 2px; font-size: 11px; color: var(--green); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.ws-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--yellow); border-radius: 2px; font-size: 10px; color: var(--yellow); }
.ws-badge.connected { border-color: var(--green); color: var(--green); }
.ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); animation: pulse 2s infinite; }
.ws-badge.connected .ws-dot { background: var(--green); }
.clock { color: var(--cyan); font-size: 12px; }
.ascii-header { color: var(--green); text-align: center; padding: 16px 24px 8px; font-size: 10px; line-height: 1.2; white-space: pre; text-shadow: 0 0 5px var(--green-glow); overflow-x: auto; }
.main { padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
.section-title { color: var(--green); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: '>'; color: var(--green-dim); }
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--green-dim), transparent); }
.grid { display: grid; gap: 12px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: 1fr 1fr; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 14px; position: relative; overflow: hidden; animation: slide-in 0.3s ease-out; transition: border-color 0.2s; }
.card:hover { border-color: var(--green-dim); }
.card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: 0; transition: opacity 0.2s; }
.card:hover::before { opacity: 1; }
.card-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.card-value { color: var(--green); font-size: 28px; font-weight: bold; text-shadow: 0 0 8px var(--green-glow); }
.card-sub { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
.progress-track { width: 100%; height: 8px; background: var(--bg3); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; transition: width 1s ease; position: relative; overflow: hidden; animation: bar-fill 1s ease-out; }
.progress-fill::after { content: ''; position: absolute; top: 0; right: 0; width: 20px; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.3)); }
.progress-fill.green { background: linear-gradient(90deg, var(--green-dim), var(--green)); }
.progress-fill.yellow { background: linear-gradient(90deg, #cc8800, var(--yellow)); }
.progress-fill.red { background: linear-gradient(90deg, #cc0033, var(--red)); }
.progress-fill.cyan { background: linear-gradient(90deg, #0099aa, var(--cyan)); }
.chart-card { padding: 12px; }
.chart-card canvas { width: 100% !important; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 8px 12px; color: var(--green); border-bottom: 1px solid var(--green-dim); font-weight: normal; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--bg3); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
.tag-online { background: rgba(0,255,65,.15); color: var(--green); border: 1px solid rgba(0,255,65,.3); }
.tag-offline { background: rgba(255,0,64,.15); color: var(--red); border: 1px solid rgba(255,0,64,.3); }
.tag-warning { background: rgba(255,215,0,.15); color: var(--yellow); border: 1px solid rgba(255,215,0,.3); }
.tag-connected { background: rgba(0,255,65,.15); color: var(--green); border: 1px solid rgba(0,255,65,.3); }
.tag-disconnected { background: rgba(255,0,64,.15); color: var(--red); border: 1px solid rgba(255,0,64,.3); }
.activity-log { max-height: 300px; overflow-y: auto; font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; }
.log-entry { padding: 4px 8px; display: flex; gap: 12px; border-bottom: 1px solid #1a1a1a; animation: slide-in 0.2s ease-out; }
.log-entry:hover { background: var(--bg3); }
.log-time { color: var(--text-dim); min-width: 80px; }
.log-type { min-width: 70px; font-weight: bold; }
.log-msg { color: var(--text); }
.log-type.info { color: var(--cyan); }
.log-type.warn { color: var(--yellow); }
.log-type.error { color: var(--red); }
.log-type.success { color: var(--green); }
.log-type.system { color: var(--purple); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { background: transparent; border: 1px solid var(--green-dim); color: var(--green); padding: 8px 16px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; border-radius: 2px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
.btn:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 15px var(--green-glow); }
.btn:active { transform: scale(0.97); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red); color: var(--bg); box-shadow: 0 0 15px rgba(255,0,64,.3); }
.auto-list { list-style: none; }
.auto-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.auto-item:last-child { border-bottom: none; }
.auto-name { color: var(--text); }
.auto-cron { color: var(--text-dim); font-size: 10px; }
.auto-last { color: var(--text-dim); font-size: 9px; margin-top: 2px; }
.auto-toggle { width: 36px; height: 18px; background: var(--bg3); border-radius: 9px; border: 1px solid var(--border); cursor: pointer; position: relative; transition: all 0.3s; }
.auto-toggle.active { background: rgba(0,255,65,.2); border-color: var(--green-dim); }
.auto-toggle::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--text-dim); position: absolute; top: 1px; left: 1px; transition: all 0.3s; }
.auto-toggle.active::after { left: 19px; background: var(--green); }
.provider-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); }
.provider-card:last-child { border-bottom: none; }
.provider-icon { font-size: 20px; min-width: 32px; text-align: center; }
.provider-info { flex: 1; }
.provider-name { color: var(--text); font-size: 12px; font-weight: bold; }
.provider-model { color: var(--text-dim); font-size: 10px; }
.cost-metric { text-align: center; padding: 10px; border-right: 1px solid var(--border); }
.cost-metric:last-child { border-right: none; }
.cost-label { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
.cost-value { color: var(--cyan); font-size: 20px; font-weight: bold; margin-top: 4px; }
.heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 8px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 2px; transition: transform 0.1s; }
.heatmap-cell:hover { transform: scale(1.3); z-index: 1; }
.heatmap-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dim); margin-top: 4px; }
.footer { border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; color: var(--text-dim); font-size: 10px; }
.refresh-indicator { position: fixed; top: 60px; right: 24px; z-index: 100; color: var(--text-dim); font-size: 10px; opacity: 0; transition: opacity 0.3s; }
.refresh-indicator.active { opacity: 1; }
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; background: var(--bg2); border: 1px solid var(--green-dim); padding: 10px 16px; border-radius: 4px; font-size: 12px; color: var(--green); transform: translateY(100px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: var(--red); color: var(--red); }
@media (max-width: 900px) { .grid-3{grid-template-columns:1fr} .grid-2{grid-template-columns:1fr} }
@media (max-width: 600px) { header{flex-direction:column;gap:8px} .ascii-header{font-size:6px} }
</style>

<main class="main">
  <div class="section-title">System Status</div>
  <div class="grid grid-3">
    <div class="card"><div class="card-label">CPU Usage</div><div class="card-value" id="cpuVal">--</div><div class="card-sub" id="cpuSub"></div><div class="progress-track"><div class="progress-fill green" id="cpuBar" style="width:0%"></div></div></div>

<script>
const API = window.location.origin;
const WS_URL = 'ws://' + window.location.host + '/ws';
let ws = null, wsReconnectDelay = 1000, lastData = null;
const MAX_POINTS = 60;
const cpuHistory = [], ramHistory = [], diskHistory = [], timeLabels = [];
Chart.defaults.color = '#666'; Chart.defaults.borderColor = '#222';
Chart.defaults.font.family = "'Cascadia Code','Fira Code',monospace"; Chart.defaults.font.size = 10;

const lineChart = new Chart(document.getElementById('lineChart').getContext('2d'), {
  type: 'line',
  data: { labels: timeLabels, datasets: [
    { label: 'CPU', data: cpuHistory, borderColor: '#00ff41', backgroundColor: 'rgba(0,255,65,.1)', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true },
    { label: 'RAM', data: ramHistory, borderColor: '#00e5ff', backgroundColor: 'rgba(0,229,255,.1)', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true },
    { label: 'Disk', data: diskHistory, borderColor: '#ffd700', backgroundColor: 'rgba(255,215,0,.05)', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true }
  ]},
  options: { responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
    scales: { y: { min: 0, max: 100, grid: { color: '#1a1a1a' }, ticks: { callback: function(v){return v+'%'} }, x: { grid: { color: '#1a1a1a' }, ticks: { maxTicksLimit: 10 } } },
    plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 12, padding: 8 } } } }
});

const barChart = new Chart(document.getElementById('barChart').getContext('2d'), {
  type: 'bar',
  data: { labels: [], datasets: [{ label: 'Tools', data: [], backgroundColor: [], borderColor: [], borderWidth: 1 }] },
  options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, grid: { color: '#1a1a1a' } }, x: { grid: { color: '#1a1a1a' } } }, plugins: { legend: { display: false } } }
});

const pieChart = new Chart(document.getElementById('pieChart').getContext('2d'), {
  type: 'doughnut',
  data: { labels: ['Ledger','Context','Cache','Free'], datasets: [{ data: [0,0,0,100], backgroundColor: ['#00ff41','#00e5ff','#b388ff','#222'], borderWidth: 0 }] },
  options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 6 } } } }
});

const timelineChart = new Chart(document.getElementById('timelineChart').getContext('2d'), {
  type: 'bar',
  data: { labels: Array.from({length:24},function(_,i){return String(i).padStart(2,'0')}), datasets: [
    { label: 'Info', data: Array(24).fill(0), backgroundColor: 'rgba(0,229,255,.5)' },
    { label: 'Success', data: Array(24).fill(0), backgroundColor: 'rgba(0,255,65,.5)' },
    { label: 'Warn', data: Array(24).fill(0), backgroundColor: 'rgba(255,215,0,.5)' },
    { label: 'Error', data: Array(24).fill(0), backgroundColor: 'rgba(255,0,64,.5)' }
  ]},
  options: { responsive: true, maintainAspectRatio: false, scales: { y: { stacked: true, grid: { color: '#1a1a1a' } }, x: { stacked: true, grid: { color: '#1a1a1a' } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 6 } } } }
});

const skillChart = new Chart(document.getElementById('skillDonut').getContext('2d'), {
  type: 'doughnut',
  data: { labels: ['Skills',''], datasets: [{ data: [0,1], backgroundColor: ['#00ff41','#222'], borderWidth: 0 }] },
  options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } }
});

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
}
setInterval(updateClock, 1000); updateClock();

function progressClass(pct) { return pct > 85 ? 'red' : pct > 60 ? 'yellow' : 'green'; }
function showToast(msg, isError) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : ''); setTimeout(function(){t.className='toast'}, 3000); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

function connectWebSocket() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = function() { wsReconnectDelay = 1000; document.getElementById('wsBadge').classList.add('connected'); document.getElementById('wsStatus').textContent = 'WS CONNECTED'; addLog('success', 'WebSocket connected -- live updates active'); };
    ws.onmessage = function(evt) { try { var data = JSON.parse(evt.data); if (data.type === 'update') { renderFull(data); document.getElementById('lastRefresh').textContent = data.timestamp || ''; } } catch(e) {} };
    ws.onclose = function() { document.getElementById('wsBadge').classList.remove('connected'); document.getElementById('wsStatus').textContent = 'WS RECONNECTING'; addLog('warn', 'WS disconnected -- reconnecting in ' + Math.round(wsReconnectDelay/1000) + 's'); setTimeout(connectWebSocket, wsReconnectDelay); wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000); };
    ws.onerror = function() {};
  } catch(e) { setTimeout(connectWebSocket, wsReconnectDelay); }
}

function renderFull(d) {
  if (d.system) renderStatus(d.system);
  if (d.servers) renderServers(d.servers);
  if (d.memory) renderMemory(d.memory);
  if (d.automations) renderAutomations(d.automations);
  if (d.providers) renderProviders(d.providers);
  if (d.skills) renderSkills(d.skills);
  if (d.history) renderHistoryTimeline(d.history);
  if (d.costs) renderCosts(d.costs);
  var ri = document.getElementById('refreshIndicator'); ri.classList.add('active'); setTimeout(function(){ri.classList.remove('active')}, 500);
  lastData = d;
}

function renderStatus(d) {
  var set = function(id, pct, detail) {
    document.getElementById(id+'Val').textContent = pct + '%';
    document.getElementById(id+'Sub').textContent = detail;
    var bar = document.getElementById(id+'Bar'); bar.style.width = pct + '%'; bar.className = 'progress-fill ' + progressClass(pct);
  };
  set('cpu', d.cpu?.percent ?? 0, d.cpu?.detail ?? '');
  set('ram', d.ram?.percent ?? 0, d.ram?.detail ?? '');
  set('disk', d.disk?.percent ?? 0, d.disk?.detail ?? '');
  document.getElementById('nodeName').textContent = d.hostname ?? 'unknown';
  document.getElementById('uptime').textContent = d.uptime ?? '--';
  document.getElementById('systemStatus').textContent = d.status ?? 'UNKNOWN';
  var now = new Date(); var label = String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  cpuHistory.push(d.cpu?.percent ?? 0); ramHistory.push(d.ram?.percent ?? 0); diskHistory.push(d.disk?.percent ?? 0); timeLabels.push(label);
  if (cpuHistory.length > MAX_POINTS) { cpuHistory.shift(); ramHistory.shift(); diskHistory.shift(); timeLabels.shift(); }
  lineChart.update('none');
}

function renderServers(servers) {
  var tbody = document.getElementById('serversBody'); tbody.innerHTML = '';
  var labels = [], data = [], colors = [];
  (servers || []).forEach(function(s) {
    var tc = s.status === 'online' ? 'tag-online' : s.status === 'warning' ? 'tag-warning' : 'tag-offline';
    tbody.innerHTML += '<tr><td style="color:var(--text)">' + esc(s.name) + '</td><td><span class="tag ' + tc + '">' + esc(s.status) + '</span></td><td style="color:var(--cyan)">' + (s.tools ?? 0) + '</td><td style="color:var(--text-dim)">' + (s.uptime ?? '--') + '</td></tr>';
    labels.push(s.name); data.push(s.tools ?? 0); colors.push(s.status === 'online' ? '#00ff41' : s.status === 'warning' ? '#ffd700' : '#ff0040');
  });
  barChart.data.labels = labels; barChart.data.datasets[0].data = data;
  barChart.data.datasets[0].backgroundColor = colors.map(function(c){return c+'44'});
  barChart.data.datasets[0].borderColor = colors; barChart.update('none');
  if (!servers?.length) tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-dim)">No servers found</td></tr>';
}

function renderMemory(m) {
  document.getElementById('ledgerVal').textContent = m.ledger_entries ?? 0;
  document.getElementById('contextVal').textContent = m.context_sessions ?? 0;
  document.getElementById('cacheVal').textContent = m.cache_hits ?? 0;
  document.getElementById('cacheSizeVal').textContent = m.cache_size ?? '0 KB';
  var ledger = m.ledger_entries ?? 0, ctx = m.context_sessions ?? 0, cache = m.cache_hits ?? 0;
  pieChart.data.datasets[0].data = [ledger, ctx, cache, Math.max(0, 100 - (ledger+ctx+cache)/10)];
  pieChart.update('none');
  document.getElementById('skillCount').textContent = m.skills_count ?? 0;
  document.getElementById('skillDetail').textContent = (m.skills_count ?? 0) + ' installed';
  skillChart.data.datasets[0].data = [m.skills_count ?? 0, Math.max(1, 20 - (m.skills_count||0))];
  skillChart.update('none');
}

function renderAutomations(autos) {
  var ul = document.getElementById('autoList'); ul.innerHTML = '';
  (autos || []).forEach(function(a) {
    ul.innerHTML += '<li class="auto-item"><div><div class="auto-name" style="color:var(--text)">' + esc(a.name) + '</div><div class="auto-cron">' + esc(a.schedule) + '</div><div class="auto-last">Last: ' + esc(a.last_run || '--') + ' // Runs: ' + (a.run_count || 0) + '</div></div><div class="auto-toggle ' + (a.active ? 'active' : '') + '" onclick="this.classList.toggle(\'active\')"></div></li>';
  });
  if (!autos?.length) ul.innerHTML = '<li style="padding:12px;color:var(--text-dim)">No automations configured</li>';
}

function renderProviders(providers) {
  var el = document.getElementById('providerList');
  var icons = { 'Anthropic': '#b388ff', 'OpenAI': '#00e5ff', 'Google': '#ffd700', 'Ollama': '#00ff41', 'OpenRouter': '#ff9100' };
  var html = '<div class="card-label" style="padding:12px 12px 0">LLM Providers</div>';
  (providers || []).forEach(function(p) {
    var tc = p.status === 'connected' ? 'tag-connected' : 'tag-disconnected';
    html += '<div class="provider-card"><div class="provider-icon" style="color:' + (icons[p.name]||'#c0c0c0') + '">&#9672;</div><div class="provider-info"><div class="provider-name">' + esc(p.name) + '</div><div class="provider-model">' + esc(p.model) + '</div></div><span class="tag ' + tc + '">' + esc(p.status) + '</span></div>';
  });
  el.innerHTML = html;
}

function renderSkills(skills) {
  document.getElementById('skillCount').textContent = skills.length;
  document.getElementById('skillDetail').textContent = skills.length + ' installed';
}

function renderHistoryTimeline(history) {
  var bins = Array(24).fill(null).map(function(){return {info:0,success:0,warn:0,error:0}});
  (history || []).forEach(function(e) {
    var h = parseInt((e.time || '00:00:00').split(':')[0], 10);
    if (h >= 0 && h < 24 && bins[h][e.type] !== undefined) bins[h][e.type]++;
  });
  timelineChart.data.datasets[0].data = bins.map(function(b){return b.info});
  timelineChart.data.datasets[1].data = bins.map(function(b){return b.success});
  timelineChart.data.datasets[2].data = bins.map(function(b){return b.warn});
  timelineChart.data.datasets[3].data = bins.map(function(b){return b.error});
  timelineChart.update('none');
  renderHeatmap(history);
}

function renderHeatmap(history) {
  var el = document.getElementById('heatmap'); var counts = Array(24).fill(0);
  (history || []).forEach(function(e) { var h = parseInt((e.time||'00:00:00').split(':')[0],10); if(h>=0&&h<24) counts[h]++; });
  var max = Math.max.apply(null, counts.concat([1])); el.innerHTML = '';
  for (var i = 0; i < 24; i++) {
    var intensity = counts[i] / max;
    var cell = document.createElement('div'); cell.className = 'heatmap-cell';
    cell.style.background = 'rgba(0,' + Math.round(intensity*255) + ',' + Math.round(intensity*65) + ',' + (0.15 + intensity*0.85) + ')';
    cell.title = String(i).padStart(2,'0') + ':00 - ' + counts[i] + ' events'; el.appendChild(cell);
  }
}

function renderCosts(c) {
  document.getElementById('costTokens').textContent = formatNum(c.estimated_tokens_today || 0);
  document.getElementById('costRequests').textContent = c.requests_today || 0;
  document.getElementById('costUsd').textContent = '$' + (c.estimated_cost_usd || 0).toFixed(4);
}

var logEntries = [];
function addLog(type, msg) {
  var now = new Date(); var time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  logEntries.unshift({time:time, type:type, msg:msg}); if (logEntries.length > 50) logEntries.pop();
  document.getElementById('activityLog').innerHTML = logEntries.map(function(e) {
    return '<div class="log-entry"><span class="log-time">' + e.time + '</span><span class="log-type ' + e.type + '">' + e.type.toUpperCase() + '</span><span class="log-msg">' + esc(e.msg) + '</span></div>';
  }).join('');
}

function runHealthCheck() {
  addLog('system', 'Health check initiated...'); showToast('Running health check...');
  fetch(API + '/api/health').then(function(r){return r.json()}).then(function(d) {
    addLog('success', 'Health: ' + d.status + ' // Servers: ' + d.servers_online + '/' + d.servers_total); showToast('Health: ' + d.status);
  }).catch(function(){ addLog('error', 'Health check failed'); showToast('Health check failed', true); });
}
function clearCache() { addLog('warn', 'Cache clearing requested'); showToast('Cache cleared'); addLog('success', 'Cache cleared successfully'); }
function showStats() {
  var d = lastData || {}, s = d.system || {}, m = d.memory || {};
  var stats = '╔══════════════════════════════════════╗\n║     SYSTEM STATISTICS v2.0           ║\n╠══════════════════════════════════════╣\n' +
    '║ Host       : ' + (s.hostname||'--') + '\n║ Uptime     : ' + (s.uptime||'--') + '\n║ CPU        : ' + (s.cpu?.percent||0) + '%\n║ RAM        : ' + (s.ram?.percent||0) + '%\n║ Disk       : ' + (s.disk?.percent||0) + '%\n' +
    '║ Ledger     : ' + (m.ledger_entries||0) + '\n║ Sessions   : ' + (m.context_sessions||0) + '\n║ Cache Hits : ' + (m.cache_hits||0) + '\n║ Skills     : ' + (m.skills_count||0) + '\n╚══════════════════════════════════════╝';
  alert(stats); addLog('info', 'Stats panel opened');
}
function restartServers() { addLog('warn', 'Server restart requested'); showToast('Restarting servers...'); setTimeout(function(){ addLog('success', 'All MCP servers restarted'); showToast('Servers restarted'); }, 2000); }

addLog('system', 'Dashboard v2.0 initialized');
addLog('info', 'Connecting via WebSocket...');
connectWebSocket();
fetch(API + '/api/full').then(function(r){return r.json()}).then(function(d){renderFull(d)}).catch(function(){
  fetch(API + '/api/status').then(function(r){return r.json()}).then(function(d){
    renderFull({system:d,servers:[],memory:{ledger_entries:0,context_sessions:0,cache_hits:0,cache_size:'0 KB',skills_count:0},automations:[],providers:[],skills:[],history:[],costs:{estimated_tokens_today:0,requests_today:0,estimated_cost_usd:0}});
  }).catch(function(){ addLog('error', 'Server unreachable'); showToast('Server unreachable', true); });
});
<\/script>
