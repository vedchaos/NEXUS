# ============================================================
# CHAOS TYPE ZERO — CI/CD Pipeline v3
# ============================================================
name: CTZ CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"
  CTZ_VERSION: "3.3"
  DOCKER_IMAGE: vedchaos/ctz

jobs:
  # ============================================================
  # 1. LINT & FORMAT
  # ============================================================
  lint:
    name: "1. Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint
        run: ruff check . --output-format=github || echo "Ruff warnings found (non-blocking)"

      - name: Ruff Format Check
        run: ruff format --check . || echo "Format issues found (non-blocking)"

  # ============================================================
  # 2. SYNTAX CHECK
  # ============================================================
  syntax:
    name: "2. Syntax Check"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check All Python Files
        run: |
          ERRORS=0
          TOTAL=0
          for f in $(find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" -not -path "./node_modules/*"); do
            TOTAL=$((TOTAL + 1))
            if ! python -m py_compile "$f" 2>/dev/null; then
              echo "SYNTAX ERROR: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo ""
          echo "Checked: $TOTAL files"
          echo "Errors: $ERRORS"
          if [ $ERRORS -gt 0 ]; then
            echo "Syntax check FAILED"
            exit 1
          fi
          echo "All Python files compile OK"

  # ============================================================
  # 3. UNIT TESTS
  # ============================================================
  test-unit:
    name: "3. Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short -m "not mcp_server" --ignore=tests/test_all_mcps.py

  # ============================================================
  # 4. MCP SERVER TESTS
  # ============================================================
  test-mcp:
    name: "4. MCP Server Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run All 42 MCP Server Tests
        run: python tests/test_all_mcps.py

  # ============================================================
  # 5. SECURITY SCAN
  # ============================================================
  security:
    name: "5. Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tools
        run: pip install bandit safety

      - name: Bandit Security Linter
        run: bandit -r bridge_core/ mcp_servers/ -ll -ii || true

      - name: Safety Dependency Check
        run: safety check -r requirements.txt || true

  # ============================================================
  # 6. DOCKER BUILD (always runs on main)
  # ============================================================
  docker:
    name: "6. Docker Build"
    runs-on: ubuntu-latest
    needs: [syntax, test-unit, test-mcp, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.CTZ_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Image
        run: echo "Docker image built successfully"

  # ============================================================
  # 7. DOCKER PUSH (only if Docker Hub secrets exist)
  # ============================================================
  docker-push:
    name: "7. Docker Push"
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: steps.docker_login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.CTZ_VERSION }}

  # ============================================================
  # 8. BUILD ARTIFACTS (always runs on main)
  # ============================================================
  build-artifacts:
    name: "8. Build Artifacts"
    runs-on: ubuntu-latest
    needs: [syntax, test-unit, test-mcp, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          mkdir -p dist
          tar czf dist/ctz-${{ env.CTZ_VERSION }}.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.pytest_cache' \
            .
          echo "Release archive created"
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctz-release-${{ env.CTZ_VERSION }}
          path: dist/
          retention-days: 30

  # ============================================================
  # 9. DEPLOY DASHBOARD TO GITHUB PAGES
  # ============================================================
  deploy-pages:
    name: "9. Deploy Dashboard"
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # 10. CREATE RELEASE (on release: commit message)
  # ============================================================
  release:
    name: "10. Create Release"
    runs-on: ubuntu-latest
    needs: [test-unit, test-mcp, build-artifacts]
    if: always() && needs.test-unit.result == 'success' && needs.test-mcp.result == 'success' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ctz-release-${{ env.CTZ_VERSION }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CTZ_VERSION }}
          name: "CHAOS TYPE ZERO v${{ env.CTZ_VERSION }}"
          body: |
            ## CHAOS TYPE ZERO v${{ env.CTZ_VERSION }}

            ### What's New
            - Kubernetes manifests (11 YAMLs)
            - Terraform AWS IaC
            - Prometheus metrics endpoint
            - Grafana monitoring dashboard
            - CI/CD GitHub Actions pipeline
            - 42 MCP servers, 316 tools
            - 88 tests passing

            ### Quick Start
            ```bash
            git clone https://github.com/vedchaos/chaos-type-zero.git
            cd chaos-type-zero
            pip install -r requirements.txt
            python dashboard/server.py
            ```

            ### Docker
            ```bash
            docker pull vedchaos/ctz:latest
            docker run -p 8080:8080 vedchaos/ctz:latest
            ```
          files:
            - dist/ctz-${{ env.CTZ_VERSION }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
